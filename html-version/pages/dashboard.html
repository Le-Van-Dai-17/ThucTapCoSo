<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="size-full flex h-screen overflow-hidden">
        
        <!-- Main Content -->
        <main class="ml-[240px] mt-16 p-8 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-y-auto bg-gray-50">
            <div class="flex-1 flex flex-col w-full mx-auto">
                <div class="mb-6 flex items-center justify-between shrink-0">
                    <div>
                        <h1 class="text-3xl font-semibold text-gray-900 mb-2">Dashboard</h1>
                        <p class="text-gray-600">Overview of your business metrics and AI-driven insights.</p>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8 shrink-0">
                    <div class="bg-white p-6 rounded-[16px] shadow-sm border border-gray-100 flex items-center gap-4">
                        <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center shrink-0">
                            <i data-lucide="shopping-cart" class="w-6 h-6 text-blue-600"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-500 mb-1">Total Orders</p>
                            <h3 class="text-2xl font-bold text-gray-900" id="statOrders">--</h3>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-[16px] shadow-sm border border-gray-100 flex items-center gap-4">
                        <div class="w-12 h-12 bg-green-50 rounded-xl flex items-center justify-center shrink-0">
                            <i data-lucide="dollar-sign" class="w-6 h-6 text-green-600"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-500 mb-1">Total Revenue</p>
                            <h3 class="text-2xl font-bold text-gray-900" id="statRevenue">--</h3>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-[16px] shadow-sm border border-gray-100 flex items-center gap-4">
                        <div class="w-12 h-12 bg-purple-50 rounded-xl flex items-center justify-center shrink-0">
                            <i data-lucide="package" class="w-6 h-6 text-purple-600"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-500 mb-1">Total Products</p>
                            <h3 class="text-2xl font-bold text-gray-900" id="statProducts">--</h3>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-[16px] shadow-sm border border-gray-100 flex items-center gap-4">
                        <div class="w-12 h-12 bg-red-50 rounded-xl flex items-center justify-center shrink-0">
                            <i data-lucide="alert-triangle" class="w-6 h-6 text-red-600"></i>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-500 mb-1">Low Stock Alerts</p>
                            <h3 class="text-2xl font-bold text-red-600" id="statLowStock">--</h3>
                        </div>
                    </div>
                </div>

                <!-- Charts & Low Stock -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 shrink-0">
                    <!-- Top Products Chart -->
                    <div class="bg-white p-6 rounded-[16px] shadow-sm border border-gray-100 flex flex-col h-96">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-lg font-bold text-gray-900">Top 10 Best Selling Items</h3>
                            <button onclick="window.location.href='reports.html'" class="text-[#2563EB] text-sm hover:underline font-medium">View Report</button>
                        </div>
                        <div class="relative flex-1 min-h-0 w-full h-full">
                            <canvas id="topProductsChart"></canvas>
                        </div>
                    </div>

                    <!-- Low Stock Warnings & AI -->
                    <div class="bg-white p-6 rounded-[16px] shadow-sm border border-gray-100 flex flex-col h-96">
                        <div class="flex items-center justify-between mb-6">
                            <h3 class="text-lg font-bold text-gray-900">Low Stock Warnings & AI Forecast</h3>
                            <button onclick="window.location.href='forecast.html'" class="text-[#2563EB] text-sm hover:underline font-medium">Run Forecast</button>
                        </div>
                        <div class="flex-1 overflow-y-auto">
                            <div class="flex flex-col gap-4" id="lowStockList">
                                <!-- Populated by JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 translate-y-full opacity-0 transition-all duration-300 z-50 flex items-center gap-3 px-6 py-4 rounded-xl shadow-lg font-medium text-sm">
        <i id="toastIcon" data-lucide="check-circle" class="w-5 h-5"></i>
        <span id="toastMessage"></span>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components/layout.js"></script>
    <script src="../assets/js/pages/dashboard.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
