<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - Inventory Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="size-full flex h-screen overflow-hidden">
        
        <!-- Main Content -->
        <main class="ml-[240px] mt-16 p-8 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-y-auto min-w-0 bg-gray-50">
            <div class="flex-1 flex flex-col w-full max-w-[1400px] mx-auto">
                <div class="mb-6 flex items-center justify-between shrink-0">
                    <div>
                        <h1 class="text-3xl font-semibold text-gray-900 mb-2">Inventory Management</h1>
                        <p class="text-gray-600">Monitor current stock levels, value, and shortages.</p>
                    </div>
                    <button class="px-6 py-3 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all duration-200 flex items-center gap-2 shadow-sm hover:shadow-md" onclick="window.location.href='purchase-orders.html'">
                        <i data-lucide="plus" class="w-5 h-5"></i> Create PO
                    </button>
                </div>

                <!-- Stats Cards -->
                <div class="grid grid-cols-4 gap-4 mb-6 shrink-0" id="inventoryStats">
                    <!-- Sẽ được đổ dữ liệu bằng JS -->
                    <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 p-6 opacity-50">
                        <div class="text-sm text-gray-500 mb-1">Total Products</div>
                        <div class="text-2xl font-semibold text-gray-900">...</div>
                    </div>
                    <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 p-6 opacity-50">
                        <div class="text-sm text-gray-500 mb-1">Total Stock</div>
                        <div class="text-2xl font-semibold text-[#10B981]">...</div>
                    </div>
                    <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 p-6 opacity-50">
                        <div class="text-sm text-gray-500 mb-1">Low Stock Items</div>
                        <div class="text-2xl font-semibold text-orange-500">...</div>
                    </div>
                    <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 p-6 opacity-50">
                        <div class="text-sm text-gray-500 mb-1">Out of Stock</div>
                        <div class="text-2xl font-semibold text-red-600">...</div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 p-6 mb-6 shrink-0">
                    <div class="flex flex-wrap items-center gap-4">
                        <div class="flex items-center gap-2">
                            <i data-lucide="filter" class="w-5 h-5 text-gray-400"></i>
                            <span class="text-sm font-medium text-gray-700">Stock Status:</span>
                        </div>
                        <select id="stockStatusFilter" class="px-4 py-2 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200">
                            <option value="all">All Items</option>
                            <option value="in_stock">In Stock (Good)</option>
                            <option value="low_stock">Low Stock (Warning)</option>
                            <option value="out_of_stock">Out of Stock (Critical)</option>
                        </select>

                        <div class="flex-1"></div>

                        <div class="relative w-72">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                            <input type="text" id="searchInput" placeholder="Search by product name..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200 text-sm">
                        </div>
                    </div>
                </div>

                <!-- Inventory Table -->
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col min-h-0">
                    <div class="overflow-y-auto flex-1 relative">
                        <table class="w-full whitespace-nowrap">
                            <thead class="bg-gray-50 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Product</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Category</th>
                                    <th class="px-6 py-4 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Current Stock</th>
                                    <th class="px-6 py-4 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Min. Level</th>
                                    <th class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Status</th>
                                </tr>
                            </thead>
                            <tbody id="inventoryTableBody" class="divide-y divide-gray-100">
                                <!-- Rendered by JS -->
                            </tbody>
                        </table>
                        
                        <!-- Empty State -->
                        <div id="emptyState" class="hidden py-16 text-center w-full">
                            <div class="text-gray-400 mb-2 flex justify-center">
                                <i data-lucide="box" class="w-12 h-12"></i>
                            </div>
                            <p class="text-gray-600 font-medium">No products found</p>
                            <p class="text-sm text-gray-500 mt-1">Try adjusting your filters</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components/layout.js"></script>
    <script src="../assets/js/pages/inventory.js"></script>
</body>
</html>
