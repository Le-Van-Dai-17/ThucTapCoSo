<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - Sales (POS)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for cart */
        .cart-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .cart-scroll::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        .cart-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .cart-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="size-full flex h-screen overflow-hidden">
        <!-- Sidebar injected via layout.js -->

        <!-- Main Content -->
        <main class="ml-[240px] mt-16 p-6 flex-1 flex gap-6 h-[calc(100vh-4rem)] overflow-hidden min-w-0">
            
            <!-- Left Side: Products Grid -->
            <div class="flex-1 flex flex-col min-w-0 bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <!-- Header & Search -->
                <div class="p-4 border-b border-gray-200 bg-white shrink-0">
                    <h1 class="text-2xl font-semibold text-gray-900 mb-4">Point of Sale</h1>
                    <div class="flex items-center gap-4">
                        <div class="flex-1 relative">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                            <input type="text" id="posSearchInput" placeholder="Search by SKU or product name..."
                                class="w-full pl-10 pr-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200"/>
                        </div>
                        <select id="posCategoryFilter"
                            class="px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200 font-medium text-gray-700 bg-white min-w-[150px]">
                            <option value="All Categories">All Categories</option>
                            <!-- Injected by JS -->
                        </select>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="flex-1 p-4 overflow-y-auto bg-gray-50/50">
                    <div id="posProductsGrid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4">
                        <!-- Product Cards injected by JS -->
                    </div>
                    <!-- Empty State -->
                    <div id="posEmptyState" class="hidden flex-col items-center justify-center py-12 text-gray-400">
                        <i data-lucide="package-search" class="w-16 h-16 mb-4 opacity-50"></i>
                        <p class="text-lg">No products found</p>
                    </div>
                </div>
            </div>

            <!-- Right Side: Cart / Checkout -->
            <div class="w-[400px] xl:w-[450px] shrink-0 flex flex-col bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <!-- Cart Header -->
                <div class="p-4 border-b border-gray-200 bg-gray-50 flex items-center justify-between shrink-0">
                    <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
                        <i data-lucide="shopping-cart" class="w-5 h-5 text-[#2563EB]"></i> Current Order
                    </h2>
                    <button id="posClearCartBtn" class="text-sm text-red-600 hover:text-red-700 font-medium flex items-center gap-1">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Clear
                    </button>
                </div>

                <!-- Cart Items -->
                <div class="flex-1 overflow-y-auto p-4 cart-scroll" id="posCartItems">
                    <!-- Cart items injected by JS -->
                    <div class="flex flex-col items-center justify-center h-full text-gray-400 opacity-50">
                        <i data-lucide="shopping-bag" class="w-16 h-16 mb-3"></i>
                        <p>Cart is empty</p>
                    </div>
                </div>

                <!-- Checkout Summary -->
                <div class="p-4 border-t border-gray-200 bg-gray-50 shrink-0">
                    <div class="space-y-3 mb-4">
                        <div class="flex justify-between text-gray-600">
                            <span>Subtotal</span>
                            <span id="posSubtotal" class="font-medium">$0.00</span>
                        </div>

                        <div class="h-px bg-gray-200 w-full my-2"></div>
                        <div class="flex justify-between items-end">
                            <span class="text-gray-900 font-medium">Total</span>
                            <span id="posTotal" class="text-3xl font-bold text-[#2563EB]">$0.00</span>
                        </div>
                    </div>
                    <button id="posCheckoutBtn" class="w-full py-3.5 bg-[#2563EB] text-white rounded-xl font-semibold text-lg hover:bg-[#1d4ed8] transition-all shadow-sm hover:shadow-md flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i data-lucide="credit-card" class="w-5 h-5"></i> Checkout
                    </button>
                </div>
            </div>

        </main>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 translate-y-full opacity-0 transition-all duration-300 z-50 flex items-center gap-3 px-6 py-4 rounded-xl shadow-lg font-medium text-sm">
        <i id="toastIcon" data-lucide="check-circle" class="w-5 h-5"></i>
        <span id="toastMessage"></span>
    </div>

    <!-- Success Modal -->
    <div id="checkoutSuccessModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4">
        <div class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onclick="closeCheckoutModal()"></div>
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden relative z-10 duration-200">
            <div class="p-6 text-center">
                <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="check-circle" class="w-8 h-8 text-green-600"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">Checkout Successful!</h3>
                <p class="text-gray-500 mb-6" id="checkoutSuccessMessage">Your transaction has been completed.</p>
                
                <div class="flex gap-3">
                    <button onclick="window.location.href='sales-data.html'" class="flex-1 px-4 py-2.5 border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 font-medium transition-colors">
                        View History
                    </button>
                    <button onclick="closeCheckoutModal()" class="flex-1 px-4 py-2.5 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] font-medium transition-colors">
                        New Order
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components/layout.js"></script>
    <script src="../assets/js/pages/pos.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
