<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - Import Data</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .drag-active {
            border-color: #2563EB;
            background-color: #EFF6FF;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="size-full flex h-screen overflow-hidden">
        
        <!-- Main Content -->
        <main class="ml-[240px] mt-16 p-8 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-y-auto bg-gray-50">
            <div class="flex-1 flex flex-col max-w-4xl mx-auto w-full">
                <div class="mb-6 flex items-center justify-between shrink-0">
                    <div>
                        <h1 class="text-3xl font-semibold text-gray-900 mb-2">Import Data</h1>
                        <p class="text-gray-600">Upload historical sales data in CSV format to improve forecast accuracy</p>
                    </div>
                    <a href="sales-data.html" class="px-5 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-all flex items-center gap-2 font-medium shadow-sm">
                        <i data-lucide="list" class="w-4 h-4"></i> View Data
                    </a>
                </div>

                <div class="bg-white rounded-2xl p-8 shadow-sm border border-gray-200">
                    <!-- Upload Area -->
                    <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-2xl p-12 text-center transition-all cursor-pointer hover:bg-gray-50 mb-8 relative">
                        <input type="file" id="fileInput" accept=".csv" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                        <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="upload-cloud" class="w-8 h-8"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-gray-900 mb-1">Click to upload or drag and drop</h3>
                        <p class="text-gray-500 text-sm">CSV file containing sale_date, product_id/sku, quantity, unit_price</p>
                    </div>

                    <!-- Selected File Info -->
                    <div id="fileInfo" class="hidden mb-8 p-4 bg-blue-50 border border-blue-100 rounded-xl flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <i data-lucide="file-text" class="w-6 h-6 text-blue-600"></i>
                            <div>
                                <p id="fileName" class="font-medium text-gray-900"></p>
                                <p id="fileSize" class="text-xs text-gray-500"></p>
                            </div>
                        </div>
                        <button id="removeFileBtn" class="p-2 text-gray-400 hover:text-red-500 transition-colors">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center justify-end border-t border-gray-200 pt-6">
                        <button id="uploadBtn" disabled class="px-8 py-3 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] disabled:bg-gray-300 disabled:cursor-not-allowed transition-all font-medium shadow-sm flex items-center gap-2">
                            <i data-lucide="play" class="w-4 h-4"></i> Start Import
                        </button>
                    </div>
                </div>

                <!-- Results Area -->
                <div id="resultArea" class="hidden mt-8">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">Import Results</h3>
                    
                    <div class="grid grid-cols-3 gap-4 mb-6">
                        <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center shrink-0">
                                <i data-lucide="file-spreadsheet" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500 mb-0.5">Total Rows</p>
                                <p id="resTotal" class="text-2xl font-bold text-gray-900">0</p>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 bg-green-50 text-green-600 rounded-xl flex items-center justify-center shrink-0">
                                <i data-lucide="check-circle" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500 mb-0.5">Imported</p>
                                <p id="resSuccess" class="text-2xl font-bold text-gray-900">0</p>
                            </div>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 bg-red-50 text-red-600 rounded-xl flex items-center justify-center shrink-0">
                                <i data-lucide="x-circle" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-sm text-gray-500 mb-0.5">Skipped</p>
                                <p id="resError" class="text-2xl font-bold text-gray-900">0</p>
                            </div>
                        </div>
                    </div>

                    <!-- Error Log -->
                    <div id="errorLogContainer" class="hidden bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-200 bg-red-50 flex items-center gap-2">
                            <i data-lucide="alert-triangle" class="w-5 h-5 text-red-600"></i>
                            <h4 class="font-medium text-red-900">Error Details</h4>
                        </div>
                        <div class="p-6 max-h-64 overflow-y-auto">
                            <ul id="errorList" class="space-y-2 text-sm text-gray-600"></ul>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components/layout.js"></script>
    <script src="../assets/js/pages/import.js"></script>
</body>
</html>
