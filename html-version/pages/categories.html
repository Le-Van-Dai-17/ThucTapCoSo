<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - Categories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="size-full flex h-screen overflow-hidden">
        <main class="ml-[240px] mt-16 p-8 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-hidden min-w-0">
            <div class="mb-6 flex items-center justify-between shrink-0">
                <div>
                    <h1 class="text-3xl font-semibold text-gray-900 mb-2">Categories</h1>
                    <p class="text-gray-600">Manage product categories used across inventory and suppliers</p>
                </div>
                <button id="addCategoryBtn" onclick="openCategoryModal()" class="px-6 py-3 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all flex items-center gap-2 shadow-sm font-medium">
                    <i data-lucide="plus" class="w-5 h-5"></i> Add Category
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 mb-6 shrink-0">
                <div class="relative max-w-xl">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                    <input id="categorySearch" type="text" placeholder="Search categories..."
                        class="w-full pl-10 pr-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all" />
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex-1 min-h-0 flex flex-col">
                <div class="overflow-y-auto flex-1">
                    <table class="w-full whitespace-nowrap">
                        <thead class="bg-gray-50 sticky top-0 z-10 border-b border-gray-200">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Category Name</th>
                                <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Description</th>
                                <th id="actionsColumn" class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categoryTableBody" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="categoryModalOverlay" class="fixed inset-0 bg-black/50 z-[70] hidden items-center justify-center p-4" onclick="closeCategoryModal()">
        <div class="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-5 pb-5 border-b border-gray-200">
                <h3 id="categoryModalTitle" class="text-xl font-semibold text-gray-900">Add Category</h3>
                <button onclick="closeCategoryModal()" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="categoryForm" class="space-y-4">
                <div id="categoryFormError" class="hidden p-3 rounded-lg bg-red-50 text-red-600 text-sm"></div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Category Name <span class="text-red-500">*</span></label>
                    <input id="categoryName" required class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:border-[#2563EB] transition-all" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Description</label>
                    <input id="categoryDescription" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:border-[#2563EB] transition-all" />
                </div>
                <div class="flex gap-3 pt-4 border-t border-gray-200">
                    <button type="button" onclick="closeCategoryModal()" class="flex-1 px-5 py-3 border-2 border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-all font-medium">Cancel</button>
                    <button id="categorySubmitBtn" type="submit" class="flex-1 px-5 py-3 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all font-medium">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components/layout.js"></script>
    <script src="../assets/js/pages/categories.js"></script>
</body>
</html>
