<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - Purchase Orders</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="size-full flex h-screen overflow-hidden">
        

        <!-- Main Content -->
        <main class="ml-[240px] mt-16 p-8 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-y-auto min-w-0 bg-gray-50">
            <div class="flex-1 flex flex-col w-full max-w-[1400px] mx-auto">
                <div class="mb-6 flex items-center justify-between shrink-0">
                    <div>
                        <h1 class="text-3xl font-semibold text-gray-900 mb-2">Purchase Orders</h1>
                        <p class="text-gray-600">Manage and track all purchase orders</p>
                    </div>
                    <button class="px-6 py-3 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all duration-200 flex items-center gap-2 shadow-sm hover:shadow-md" onclick="alert('Open new PO modal')">
                        <i data-lucide="plus" class="w-5 h-5"></i> New Purchase Order
                    </button>
                </div>

                <!-- Filters and Actions -->
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 p-6 mb-6 shrink-0">
                    <div class="flex flex-wrap items-center gap-4">
                        <div class="flex items-center gap-2">
                            <i data-lucide="filter" class="w-5 h-5 text-gray-400"></i>
                            <span class="text-sm font-medium text-gray-700">Filter by Status:</span>
                        </div>
                        <select id="statusFilter" class="px-4 py-2 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200">
                            <option value="all">All Status</option>
                            <option value="draft">Draft</option>
                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                            <option value="received">Received</option>
                        </select>

                        <div class="flex-1"></div>

                        <button onclick="alert('Export functionality outputting CSV/Excel...')" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-all duration-200 flex items-center gap-2">
                            <i data-lucide="download" class="w-4 h-4"></i> Export
                        </button>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="grid grid-cols-4 gap-4 mb-6 shrink-0" id="statsCardsContainer">
                    <!-- Populated by JS -->
                </div>

                <!-- Orders Table -->
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col min-h-0">
                    <div class="overflow-y-auto flex-1 relative">
                        <table class="w-full whitespace-nowrap">
                            <thead class="bg-gray-50 sticky top-0 z-10">
                                <tr>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Order ID</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Supplier</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Created Date</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Status</th>
                                    <th class="px-6 py-4 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Items</th>
                                    <th class="px-6 py-4 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Total Value</th>
                                    <th class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-gray-100">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                        
                        <!-- Empty State -->
                        <div id="emptyState" class="hidden py-16 text-center w-full">
                            <div class="text-gray-400 mb-2 flex justify-center">
                                <i data-lucide="filter" class="w-12 h-12"></i>
                            </div>
                            <p class="text-gray-600 font-medium">No purchase orders found</p>
                            <p class="text-sm text-gray-500 mt-1">Try adjusting your status filter</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/pages/purchase-orders.js"></script>
    <script src="../assets/js/components/layout.js"></script>
</body>
</html>
