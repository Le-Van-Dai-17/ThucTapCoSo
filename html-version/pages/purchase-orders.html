<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - Purchase Orders</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="size-full flex h-screen overflow-hidden">
        

        <!-- Main Content -->
        <main class="ml-[240px] mt-16 p-8 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-y-auto min-w-0 bg-gray-50">
            <div class="flex-1 flex flex-col w-full max-w-[1400px] mx-auto">
                <div class="mb-6 flex items-center justify-between shrink-0">
                    <div>
                        <h1 class="text-3xl font-semibold text-gray-900 mb-2">Purchase Orders</h1>
                        <p class="text-gray-600">Manage and track all purchase orders</p>
                    </div>
                    <button class="px-6 py-3 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all duration-200 flex items-center gap-2 shadow-sm hover:shadow-md" onclick="openCreatePOModal()">
                        <i data-lucide="plus" class="w-5 h-5"></i> New Purchase Order
                    </button>
                </div>

                <!-- Filters and Actions -->
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 p-6 mb-6 shrink-0">
                    <div class="flex flex-wrap items-center gap-4">
                        <div class="flex items-center gap-2">
                            <i data-lucide="filter" class="w-5 h-5 text-gray-400"></i>
                            <span class="text-sm font-medium text-gray-700">Filter by Status:</span>
                        </div>
                        <select id="statusFilter" class="px-4 py-2 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200">
                            <option value="all">All Status</option>
                            <option value="draft">Draft</option>
                            <option value="pending">Pending</option>
                            <option value="approved">Approved</option>
                            <option value="received">Received</option>
                        </select>

                        <div class="flex-1"></div>

                        <button onclick="alert('Export functionality outputting CSV/Excel...')" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-all duration-200 flex items-center gap-2">
                            <i data-lucide="download" class="w-4 h-4"></i> Export
                        </button>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="grid grid-cols-4 gap-4 mb-6 shrink-0" id="statsCardsContainer">
                    <!-- Populated by JS -->
                </div>

                <!-- Orders Table -->
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col min-h-0">
                    <div class="overflow-y-auto flex-1 relative">
                        <table class="w-full whitespace-nowrap">
                            <thead class="bg-gray-50 sticky top-0 z-10">
                                <tr>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Order ID</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Supplier</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Created Date</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Status</th>
                                    <th class="px-6 py-4 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Items</th>
                                    <th class="px-6 py-4 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Total Value</th>
                                    <th class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider border-b-2 border-gray-200">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-gray-100">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                        
                        <!-- Empty State -->
                        <div id="emptyState" class="hidden py-16 text-center w-full">
                            <div class="text-gray-400 mb-2 flex justify-center">
                                <i data-lucide="filter" class="w-12 h-12"></i>
                            </div>
                            <p class="text-gray-600 font-medium">No purchase orders found</p>
                            <p class="text-sm text-gray-500 mt-1">Try adjusting your status filter</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal View Details -->
<div id="detailModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[80vh] overflow-y-auto shadow-2xl">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-200">
            <h3 class="text-xl font-semibold text-gray-900">Order Details — <span id="detailOrderNumber"></span></h3>
            <button onclick="closeDetailModal()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
            </button>
        </div>
        <div id="detailContent" class="text-sm text-gray-600">Loading...</div>
    </div>
</div>

<!-- Modal Create PO -->
<div id="createPOModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-200">
            <h3 class="text-xl font-semibold text-gray-900">New Purchase Order</h3>
            <button onclick="closeCreatePOModal()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
            </button>
        </div>
        <form id="createPOForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Order Number <span class="text-red-500">*</span></label>
                    <input type="text" id="poOrderNumber" required placeholder="e.g. PO-2024-010"
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Supplier Name</label>
                    <input type="text" id="poSupplier" placeholder="e.g. TechSupply Inc."
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Total Amount ($)</label>
                    <input type="number" id="poTotalAmount" min="0" step="0.01" placeholder="0.00" readonly
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl bg-gray-50 text-gray-500 focus:outline-none cursor-not-allowed transition-all"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Status</label>
                    <select id="poStatus" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] bg-white transition-all">
                        <option value="pending">Pending</option>
                        <option value="ordered">Ordered</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
            </div>

            <div class="border-t-2 border-dashed border-gray-200 pt-4 mt-2">
                <label class="block text-sm font-semibold text-gray-800 mb-2">Add Products to Order</label>
                <div class="grid grid-cols-12 gap-3 items-end">
                    <div class="col-span-6">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Product Name (Type to search or create new)</label>
                        <input type="text" id="poItemProductName" list="productsDatalist" placeholder="Type product name..." 
                            class="w-full px-3 py-2 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] bg-white text-sm transition-all" />
    
                        <datalist id="productsDatalist"></datalist>
                    </div>
                    <div class="col-span-3">
                        <label class="block text-xs font-medium text-gray-500 mb-1">Quantity</label>
                        <input type="number" id="poItemQty" min="1" value="1" class="w-full px-3 py-2 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] text-sm transition-all" />
                    </div>
                    <div class="col-span-3">
                        <button type="button" id="addPOItemBtn" class="w-full py-2 bg-blue-50 hover:bg-blue-100 text-[#2563EB] border-2 border-blue-200 rounded-xl text-sm font-semibold transition-all">
                            + Add
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-gray-50 p-3 rounded-xl border-2 border-gray-100 max-h-36 overflow-y-auto">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Selected Items:</p>
                <ul id="poItemsListUI" class="text-xs text-gray-700 divide-y divide-gray-100">
                    <li class="py-2 text-gray-400 italic">No products selected yet.</li>
                </ul>
            </div>
            <p id="createPOError" class="hidden text-sm text-red-600 bg-red-50 px-4 py-2 rounded-lg"></p>
            <div class="flex gap-3 pt-4 border-t border-gray-200">
                <button type="button" onclick="closeCreatePOModal()" class="flex-1 px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-all font-medium">Cancel</button>
                <button type="submit" id="createPOBtn" class="flex-1 px-6 py-3 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all shadow-md font-medium">Create Order</button>
            </div>
        </form>
    </div>
</div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/pages/purchase-orders.js"></script>
    <script src="../assets/js/components/layout.js"></script>
</body>
</html>
