<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - Demand Data</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="size-full flex h-screen overflow-hidden">

        <!-- Main Content -->
        <main class="ml-[240px] mt-16 p-8 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-hidden min-w-0 flex-nowrap shrink-0">
            <!-- Header section -->
            <div class="mb-6 shrink-0">
                <h1 class="text-3xl font-semibold text-gray-900 mb-2">Demand Data</h1>
                <p class="text-gray-600">Track and analyze your sales performance</p>
            </div>

            <!-- Filter Bar -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 mb-6 shrink-0">
                <div class="flex items-center gap-4 flex-wrap">
                    <!-- Date Range -->
                    <div class="flex items-center gap-2">
                        <i data-lucide="calendar" class="w-5 h-5 text-gray-400"></i>
                        <input type="date" id="startDate" class="px-3 py-2 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200" />
                        <span class="text-gray-500">to</span>
                        <input type="date" id="endDate" class="px-3 py-2 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200" />
                    </div>
                    
                    <!-- Product Filter -->
                    <div class="flex items-center gap-2">
                        <i data-lucide="filter" class="w-5 h-5 text-gray-400"></i>
                        <select id="productFilter" class="px-4 py-2 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200 font-medium text-gray-700 bg-white min-w-[250px]">
                            <option value="All Products">All Products</option>
                            <!-- Generated by JS -->
                        </select>
                    </div>

                    <div class="flex-1"></div>

                    <button onclick="openAddSaleModal()" class="px-6 py-2 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all duration-200 flex items-center gap-2 shadow-sm font-medium hover:shadow-md">
                        <i data-lucide="plus" class="w-5 h-5"></i> Add Sale
                    </button>
                    <!-- Export Button -->
                    <div class="flex items-center gap-2 bg-white p-1.5 rounded-xl border border-gray-200 shadow-sm">
                        <input type="file" id="csvFileInput" accept=".csv" class="text-sm text-gray-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                        <button id="importCSVBtn" onclick="handleImportCSV(event)" class="bg-[#2563EB] hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors duration-200 flex items-center gap-1">
                            <i data-lucide="upload" class="w-4 h-4"></i> Import CSV
                        </button>
                    </div>

                    <button id="exportBtn" class="px-6 py-2 bg-[#10B981] text-white rounded-xl hover:bg-[#059669] transition-all duration-200 flex items-center gap-2 shadow-sm font-medium hover:shadow-md">
                       <i data-lucide="download" class="w-5 h-5"></i> Export CSV
                    </button>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="grid grid-cols-3 gap-4 mb-6 shrink-0" id="statsCards">
                <!-- Data populated via JS -->
            </div>

            <!-- Line Chart -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 mb-6 shrink-0">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">Demand Trend</h3>
                <div class="relative h-[250px] w-full">
                    <canvas id="salesChart"></canvas>
                </div>
            </div>

            <!-- Sales Table -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col min-h-0">
                <div class="overflow-auto flex-1 h-full relative">
                    <table class="w-full whitespace-nowrap">
                        <thead class="bg-gray-50 border-b-2 border-gray-200 sticky top-0 z-10">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Date</th>
                                <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Product</th>
                                <th class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider">Quantity Sold</th>
                                <th class="px-6 py-4 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider">Unit Price</th>
                                <th class="px-6 py-4 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider">Total</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-gray-100">
                            <!-- JS render -->
                        </tbody>
                    </table>

                    <!-- Empty State -->
                    <div id="emptyState" class="hidden py-16 text-center">
                        <div class="text-gray-400 mb-2 flex justify-center">
                            <i data-lucide="filter" class="w-12 h-12"></i>
                        </div>
                        <p class="text-gray-600 font-medium">No sales data found</p>
                        <p class="text-sm text-gray-500 mt-1">Try adjusting your filters</p>
                    </div>
                </div>

                <!-- Table Footer -->
                <div id="tableFooter" class="border-t-2 border-gray-200 bg-gray-50 px-6 py-4 shrink-0 hidden">
                    <div class="flex justify-end items-center gap-8">
                        <div class="text-sm text-gray-600">
                            Total Records: <span id="fTotalRecords" class="font-semibold text-gray-900">0</span>
                        </div>
                        <div class="text-sm text-gray-600">
                            Total Quantity: <span id="fTotalQty" class="font-semibold text-[#2563EB]">0</span>
                        </div>
                        <div class="text-sm text-gray-600">
                            Total Revenue: <span id="fTotalRev" class="font-semibold text-[#10B981] text-lg">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>
            
        </main>
    </div>
    
    <!-- FE-05: Modal Add Sale -->
    <div id="addSaleModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl">
            <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-200">
                <div>
                    <h3 class="text-xl font-semibold text-gray-900">Add New Sale</h3>
                    <p class="text-sm text-gray-500 mt-0.5">Record a new sales transaction</p>
                </div>
                <button onclick="closeAddSaleModal()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
                </button>
            </div>
            <form id="addSaleForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Product <span class="text-red-500">*</span></label>
                    <select id="saleProductId" required class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] bg-white transition-all">
                        <option value="">-- Select product --</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Sale Date <span class="text-red-500">*</span></label>
                        <input type="date" id="saleDate" required class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Quantity <span class="text-red-500">*</span></label>
                        <input type="number" id="saleQty" required min="1" placeholder="0" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                    </div>
                </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Unit Price ($) <span class="text-red-500">*</span></label>
                    <input type="number" id="saleUnitPrice" required min="0" step="0.01" placeholder="0.00" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Discount ($)</label>
                    <input type="number" id="saleDiscount" min="0" step="0.01" value="0" placeholder="0.00" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
            </div>
            <div class="mt-4">
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Total Amount ($)</label>
                <input type="number" id="saleTotalAmount" readonly placeholder="Auto calculated" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl bg-gray-50 text-gray-500 transition-all"/>
            </div>
            <p id="addSaleError" class="hidden text-sm text-red-600 bg-red-50 px-4 py-2 rounded-lg mt-4"></p>
            <div class="flex gap-3 pt-4 mt-4 border-t border-gray-200">
                <button type="button" onclick="closeAddSaleModal()" class="flex-1 px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-all font-medium">Cancel</button>
                <button type="submit" id="addSaleBtn" class="flex-1 px-6 py-3 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all shadow-md font-medium">Add Sale</button>
            </div>
        </form>
    </div>
</div> 

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/pages/sales-data.js"></script>
    <script src="../assets/js/components/layout.js"></script>
</body>
</html>
