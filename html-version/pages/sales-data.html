<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - Transaction History</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    
    <!-- Modal View Details -->
    <div id="detailModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-3xl w-full max-h-[85vh] overflow-y-auto shadow-2xl relative" onclick="event.stopPropagation()">
            <div class="flex items-start justify-between mb-6 pb-4 border-b border-gray-200">
                <div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-1" id="detailModalTitle">Transaction Details</h3>
                    <div class="text-sm text-gray-500 font-medium font-mono" id="detailModalCode"></div>
                </div>
                <button onclick="closeDetailModal()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <i data-lucide="x" class="w-6 h-6 text-gray-500"></i>
                </button>
            </div>
            
            <div id="detailModalInfo" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 text-sm text-gray-600 bg-gray-50 p-4 rounded-xl">
                <!-- info dynamically filled -->
            </div>

            <div class="overflow-x-auto mb-6 rounded-lg border border-gray-200">
                <table class="w-full text-sm text-left text-gray-500">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-100">
                        <tr>
                            <th scope="col" class="px-6 py-3">Product</th>
                            <th scope="col" id="detailModalQtyHeader" class="px-6 py-3 text-center">Quantity</th>
                            <th scope="col" class="px-6 py-3 text-right">Unit Price</th>
                            <th scope="col" class="px-6 py-3 text-right">Total Amount</th>
                        </tr>
                    </thead>
                    <tbody id="detailModalTableBody" class="divide-y divide-gray-200">
                        <!-- items dynamically filled -->
                    </tbody>
                </table>
            </div>

            <div class="flex justify-end pt-4 border-t border-gray-200">
                <button onclick="closeDetailModal()" class="px-6 py-2.5 bg-gray-900 hover:bg-gray-800 text-white rounded-xl transition-all font-medium">Close</button>
            </div>
        </div>
    </div>

    <div class="size-full flex h-screen overflow-hidden">
        
        <!-- Main Content -->
        <main class="ml-[240px] mt-16 p-8 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-y-auto bg-gray-50">
            <div class="flex-1 flex flex-col w-full mx-auto space-y-6">
                
                <div class="flex items-center justify-between shrink-0">
                    <div>
                        <h1 class="text-3xl font-semibold text-gray-900 mb-2">Transaction History</h1>
                        <p class="text-gray-600">Sales and purchase transaction history (POS / Purchase Orders)</p>
                    </div>
                    <div class="flex gap-3">
                    </div>
                </div>

                <!-- Filters Section -->
                <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                        <label class="block">
                            <span class="text-sm font-medium text-gray-700">Transaction Type (Buy/Sell)</span>
                            <select id="typeFilter" class="mt-2 w-full px-4 py-3 border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-100">
                                <option value="all">All Transactions</option>
                                <option value="sell">Sales</option>
                                <option value="buy">Purchases</option>
                            </select>
                        </label>
                        <label class="block">
                            <span class="text-sm font-medium text-gray-700">From Date</span>
                            <input type="date" id="startDateFilter" class="mt-2 w-full px-4 py-3 border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-100">
                        </label>
                        <label class="block">
                            <span class="text-sm font-medium text-gray-700">To Date</span>
                            <input type="date" id="endDateFilter" class="mt-2 w-full px-4 py-3 border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-100">
                        </label>
                    </div>
                </section>

                <!-- Table -->
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col min-h-0 relative">
                    <div class="overflow-y-auto flex-1 h-full">
                        <table class="w-full whitespace-nowrap">
                            <thead class="bg-gray-50 sticky top-0 z-10">
                                <tr>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Transaction Date</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Transaction Code</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Type</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Performed By</th>
                                    <th class="px-6 py-4 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Total Amount</th>
                                    <th class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="salesTableBody" class="divide-y divide-gray-100">
                                <!-- Data injected here by JS -->
                            </tbody>
                        </table>
                        
                        <!-- Empty State -->
                        <div id="emptyState" class="hidden py-16 text-center w-full">
                            <div class="text-gray-400 mb-2 flex justify-center">
                                <i data-lucide="inbox" class="w-12 h-12"></i>
                            </div>
                            <p class="text-gray-600 font-medium">No transactions found</p>
                            <p class="text-sm text-gray-500 mt-1">Adjust filters to see results.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components/layout.js"></script>
    <script src="../assets/js/pages/sales-data.js"></script>
</body>
</html>
