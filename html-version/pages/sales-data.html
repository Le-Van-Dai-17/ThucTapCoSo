<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - Demand Data</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="size-full flex h-screen overflow-hidden">
        
        <!-- Main Content -->
        <main class="ml-[240px] mt-16 p-8 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-y-auto bg-gray-50">
            <div class="flex-1 flex flex-col w-full mx-auto">
                <div class="mb-6 flex items-center justify-between shrink-0">
                    <div>
                        <h1 class="text-3xl font-semibold text-gray-900 mb-2">Demand Data</h1>
                        <p class="text-gray-600">Historical sales records and transaction data</p>
                    </div>
                    <div class="flex gap-3">
                        <a href="import.html" class="px-5 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-all flex items-center gap-2 font-medium shadow-sm">
                            <i data-lucide="upload" class="w-4 h-4"></i> Import Data
                        </a>
                    </div>
                </div>

                <!-- Table -->
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col min-h-0 relative">
                    <div class="overflow-y-auto flex-1 h-full">
                        <table class="w-full whitespace-nowrap">
                            <thead class="bg-gray-50 sticky top-0 z-10">
                                <tr>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Date</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Transaction ID</th>
                                    <th class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Items</th>
                                    <th class="px-6 py-4 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Total Amount</th>
                                    <th class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="salesTableBody" class="divide-y divide-gray-100">
                                <!-- Data injected here by JS -->
                            </tbody>
                        </table>
                        
                        <!-- Empty State -->
                        <div id="emptyState" class="hidden py-16 text-center w-full">
                            <div class="text-gray-400 mb-2 flex justify-center">
                                <i data-lucide="inbox" class="w-12 h-12"></i>
                            </div>
                            <p class="text-gray-600 font-medium">No sales data found</p>
                            <p class="text-sm text-gray-500 mt-1">Import historical data to start forecasting.</p>
                            <div class="mt-6">
                                <a href="import.html" class="inline-flex px-6 py-3 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all items-center gap-2 font-medium shadow-sm">
                                    <i data-lucide="upload" class="w-5 h-5"></i> Import CSV
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Sale Detail Modal -->
    <div id="saleDetailOverlay" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 hidden transition-opacity opacity-0 flex items-center justify-center p-4">
        <div id="saleDetailModal" class="bg-white rounded-2xl shadow-xl w-full max-w-3xl transform scale-95 opacity-0 transition-all flex flex-col max-h-[90vh]">
            <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center border border-blue-100">
                        <i data-lucide="receipt" class="w-5 h-5 text-blue-600"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-gray-900" id="saleDetailTitle">Sale Detail</h2>
                        <p class="text-sm text-gray-500" id="saleDetailDate">Date: --</p>
                    </div>
                </div>
                <button type="button" onclick="closeSaleDetail()" class="text-gray-400 hover:text-gray-600 hover:bg-gray-50 p-2 rounded-xl transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="p-6 overflow-y-auto flex-1">
                <div class="bg-gray-50 rounded-xl border border-gray-200 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-100/50">
                            <tr>
                                <th class="px-5 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Product</th>
                                <th class="px-5 py-3 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider">Quantity</th>
                                <th class="px-5 py-3 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider">Unit Price</th>
                                <th class="px-5 py-3 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider">Total</th>
                            </tr>
                        </thead>
                        <tbody id="saleDetailBody" class="bg-white divide-y divide-gray-100 text-sm">
                            <!-- Items injected by JS -->
                        </tbody>
                        <tfoot class="bg-gray-50 font-semibold border-t border-gray-200">
                            <tr>
                                <td colspan="3" class="px-5 py-3 text-right text-gray-700">Total Amount:</td>
                                <td id="saleDetailTotal" class="px-5 py-3 text-right text-[#2563EB]">$0.00</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
            
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end shrink-0">
                <button type="button" onclick="closeSaleDetail()" class="px-5 py-2.5 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 transition-colors font-medium">Close</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components/layout.js"></script>
    <script src="../assets/js/pages/sales-data.js"></script>
</body>
</html>
