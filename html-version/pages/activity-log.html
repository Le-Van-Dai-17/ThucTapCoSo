<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - Activity Log</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="size-full flex h-screen overflow-hidden">
        

        <!-- Main Content -->
        <main class="ml-[240px] mt-16 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-y-auto bg-gray-50">
            
            <div class="bg-white border-b border-gray-200 px-8 py-6 shrink-0">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-[#2563EB]/10 rounded-xl flex items-center justify-center">
                                <i data-lucide="activity" class="w-5 h-5 text-[#2563EB]"></i>
                            </div>
                            <div>
                                <h1 class="text-2xl font-semibold text-gray-900">Activity Log</h1>
                                <p class="text-sm text-gray-500 mt-0.5">Track all system activities and user actions</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="px-4 py-2 bg-gray-50 rounded-xl">
                            <div class="text-xs text-gray-500 font-medium">Total Activities</div>
                            <div class="text-xl font-semibold text-gray-900" id="totalActivities">0</div>
                        </div>
                        <div class="px-4 py-2 bg-[#2563EB]/5 rounded-xl">
                            <div class="text-xs text-[#2563EB] font-medium">Filtered Results</div>
                            <div class="text-xl font-semibold text-[#2563EB]" id="filteredResults">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-8 flex-1 flex flex-col min-h-0">
                <!-- Search and Filter Bar -->
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 p-4 mb-6 shrink-0 relative z-20">
                    <div class="flex items-center gap-4">
                        <!-- Search Input -->
                        <div class="flex-1 relative">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                            <input type="text" id="searchInput" placeholder="Search by user, action, table, or IP address..." class="w-full pl-10 pr-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200" />
                        </div>

                        <!-- User Filter Dropdown -->
                        <div class="relative">
                            <button id="userFilterBtn" onclick="toggleUserFilter()" class="flex items-center gap-2 px-4 py-2.5 border-2 border-gray-200 rounded-xl hover:bg-gray-50 transition-all duration-200 font-medium text-gray-700 bg-white min-w-[180px] justify-between">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="filter" class="w-4 h-4"></i>
                                    <span class="text-sm" id="userFilterText">All Users</span>
                                </div>
                                <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200" id="userFilterIcon"></i>
                            </button>

                            <div id="userFilterMenu" class="absolute top-full mt-2 right-0 w-[200px] bg-white border-2 border-gray-200 rounded-xl shadow-lg z-10 max-h-[300px] overflow-y-auto hidden">
                                <div class="p-2" id="userFilterOptions">
                                    <button onclick="selectUserFilter('All Users')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors duration-150 text-sm bg-[#2563EB]/10 text-[#2563EB] font-medium">All Users</button>
                                    <!-- Populated by JS -->
                                </div>
                            </div>
                        </div>

                        <!-- Date Filter Dropdown -->
                        <div class="relative">
                            <button id="dateFilterBtn" onclick="toggleDateFilter()" class="flex items-center gap-2 px-4 py-2.5 border-2 border-gray-200 rounded-xl hover:bg-gray-50 transition-all duration-200 font-medium text-gray-700 bg-white min-w-[180px] justify-between">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="calendar" class="w-4 h-4"></i>
                                    <span class="text-sm" id="dateFilterText">All Time</span>
                                </div>
                                <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200" id="dateFilterIcon"></i>
                            </button>

                            <div id="dateFilterMenu" class="absolute top-full mt-2 right-0 w-[180px] bg-white border-2 border-gray-200 rounded-xl shadow-lg z-10 hidden">
                                <div class="p-2">
                                    <button onclick="selectDateFilter('All Time')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors duration-150 text-sm bg-[#2563EB]/10 text-[#2563EB] font-medium">All Time</button>
                                    <button onclick="selectDateFilter('Today')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors duration-150 text-sm text-gray-700">Today</button>
                                    <button onclick="selectDateFilter('Last 7 Days')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors duration-150 text-sm text-gray-700">Last 7 Days</button>
                                    <button onclick="selectDateFilter('Last 30 Days')" class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-50 transition-colors duration-150 text-sm text-gray-700">Last 30 Days</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Activity Table -->
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col relative z-0">
                    <div class="overflow-auto flex-1 h-full">
                        <table class="w-full whitespace-nowrap min-w-[900px]">
                            <thead class="bg-gray-50 border-b border-gray-200 sticky top-0 z-10">
                                <tr>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">User</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Action</th>
                                    <th class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider">Table Affected</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Timestamp</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">IP Address</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-gray-100">
                                <!-- Populated by JS -->
                            </tbody>
                        </table>

                        <!-- Empty State -->
                        <div id="emptyState" class="hidden py-16 text-center w-full">
                            <div class="text-gray-400 mb-2 flex justify-center">
                                <i data-lucide="activity" class="w-12 h-12"></i>
                            </div>
                            <p class="text-gray-600 font-medium">No activities found</p>
                            <p class="text-sm text-gray-500 mt-1">Try adjusting your search or filters</p>
                        </div>
                    </div>

                    <!-- Pagination Info -->
                    <div id="paginationInfo" class="px-6 py-4 border-t border-gray-200 bg-gray-50 shrink-0">
                        <div class="flex items-center justify-between text-sm text-gray-600">
                            <span>Showing <span class="font-semibold text-gray-900" id="showTotal"></span> of <span class="font-semibold text-gray-900" id="totalMax"></span> activities</span>
                            <span class="text-xs text-gray-500" id="lastUpdated"></span>
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/pages/activity-log.js"></script>
    <script src="../assets/js/components/layout.js"></script>
</body>
</html>
