<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo Hao hụt kho - AI Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-inter text-sm">
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <div class="size-full flex h-screen overflow-hidden">
        <!-- Main Content -->
        <main class="ml-[240px] mt-16 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-hidden relative transition-all duration-300 min-w-0" id="main-content">

            <!-- Page Content -->
            <div class="flex-1 overflow-auto p-4 sm:p-8">
                <div class="max-w-4xl mx-auto space-y-6">
                    <!-- Page Header -->
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Báo cáo Hao hụt kho</h1>
                        <p class="text-sm text-gray-500 mt-1">Ghi nhận và báo cáo hàng hóa bị hỏng, rách bao bì, biến chất trong quá trình lưu kho.</p>
                    </div>

                    <!-- Adjustment Form -->
                    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                        <div class="p-6">
                            <form id="adjustmentForm" class="space-y-6">
                                <!-- Product Select -->
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Sản phẩm bị hao hụt</label>
                                    <select id="adjProduct" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required>
                                        <option value="" disabled selected>Đang tải danh sách sản phẩm...</option>
                                    </select>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                    <!-- Quantity -->
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-2">Số lượng (Deduction)</label>
                                        <input type="number" id="adjQuantity" min="1" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Nhập số lượng hao hụt" required>
                                    </div>
                                    
                                    <!-- Reason -->
                                    <div class="space-y-4">
                                        <div>
                                            <label class="block text-sm font-medium text-gray-700 mb-2">Lý do hao hụt (Bắt buộc)</label>
                                            <select id="adjReason" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500" required onchange="document.getElementById('adjReasonOtherContainer').classList.toggle('hidden', this.value !== 'Other')">
                                                <option value="" disabled selected>Chọn lý do...</option>
                                                <option value="Expired">Expired (Hết hạn)</option>
                                                <option value="Moldy">Moldy (Ẩm mốc/Biến chất)</option>
                                                <option value="Torn Packaging">Torn Packaging (Rách bao bì/Vỡ)</option>
                                                <option value="Lost">Lost (Thất lạc)</option>
                                                <option value="Other">Other (Lý do khác)</option>
                                            </select>
                                        </div>

                                        <div id="adjReasonOtherContainer" class="hidden">
                                            <label class="block text-sm font-medium text-gray-700 mb-2">Ghi rõ lý do (Bắt buộc)</label>
                                            <input type="text" id="adjReasonOther" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Nhập lý do hao hụt cụ thể..." />
                                        </div>
                                    </div>
                                </div>

                                <div class="pt-4 border-t border-gray-100 flex justify-end">
                                    <button type="submit" id="btnSubmitAdjustment" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-xl font-medium transition-colors flex items-center gap-2">
                                        <i data-lucide="send" class="w-4 h-4"></i>
                                        Gửi báo cáo cho Manager
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/components/layout.js"></script>
    <script src="../assets/js/pages/inventory-adjustment.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
