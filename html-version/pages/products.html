<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
<div class="size-full flex h-screen overflow-hidden">

    <!-- Main Content -->
    <main class="ml-[240px] mt-16 p-8 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-hidden min-w-0">
        <div class="mb-6 shrink-0">
            <h1 class="text-3xl font-semibold text-gray-900 mb-2">Products</h1>
            <p class="text-gray-600">Manage your product inventory and details</p>
        </div>

        <!-- Top Bar -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 mb-6 shrink-0">
            <div class="flex items-center gap-4">
                <div class="flex-1 relative">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                    <input type="text" id="searchInput" placeholder="Search by product name or SKU..."
                        class="w-full pl-10 pr-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200"/>
                </div>
                <select id="categoryFilter"
                    class="px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200 font-medium text-gray-700 bg-white min-w-[180px]">
                    <option value="All Categories">All Categories</option>
                    <option value="Gạo">Gạo</option>
                    <option value="Mì gói">Mì gói</option>
                    <option value="Miến/Bún khô">Miến/Bún khô</option>
                    <option value="Bột">Bột</option>
                    <option value="Gia vị cơ bản">Gia vị cơ bản</option>
                    <option value="Ngũ cốc">Ngũ cốc</option>
                </select>
                <!-- FE-01: Nút Add Product — gọi openAddModal() thay vì inline onclick cũ -->
                <button onclick="openAddModal()"
                    class="px-6 py-2.5 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all duration-200 flex items-center gap-2 shadow-sm hover:shadow-md font-medium">
                    <i data-lucide="plus" class="w-5 h-5"></i> Add Product
                </button>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-4 gap-4 mb-6 shrink-0" id="statsCards"></div>

        <!-- Products Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-[#E2E8F0] overflow-hidden flex-1 min-h-0 flex flex-col">
            <div class="overflow-y-auto flex-1">
                <table class="w-full whitespace-nowrap relative">
                    <thead class="bg-gray-50 sticky top-0 z-10 border-b-2 border-[#E2E8F0]">
                        <tr>
                            <th class="px-4 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">SKU</th>
                            <th class="px-4 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Product Name</th>
                            <th class="px-4 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Category</th>
                            <th class="px-4 py-4 text-right text-xs font-semibold text-gray-700 uppercase tracking-wider">Selling Price</th>
                            <th class="px-4 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider">Current Stock</th>
                            <th class="px-4 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider">Status</th>
                            <th class="px-4 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- ============================================================
     FE-01: MODAL ADD PRODUCT (thay thế placeholder cũ)
     Form đầy đủ — gọi POST /api/products/create
     ============================================================ -->
<div id="addModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-200">
            <div>
                <h3 class="text-xl font-semibold text-gray-900">Add New Product</h3>
                <p class="text-sm text-gray-500 mt-0.5">Fill in the details below</p>
            </div>
            <button onclick="closeAddModal()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
            </button>
        </div>

        <!-- Form -->
        <form id="addProductForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">SKU <span class="text-red-500">*</span></label>
                    <input type="text" id="addSku" required placeholder="e.g. WBH-001"
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Product Name <span class="text-red-500">*</span></label>
                    <input type="text" id="addName" required placeholder="e.g. Wireless Headphones"
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Category</label>
                    <select id="addCategory" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all bg-white">
                        <option value="Gạo">Gạo</option>
                        <option value="Mì gói">Mì gói</option>
                        <option value="Miến/Bún khô">Miến/Bún khô</option>
                        <option value="Bột">Bột</option>
                        <option value="Gia vị cơ bản">Gia vị cơ bản</option>
                        <option value="Ngũ cốc">Ngũ cốc</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Status</label>
                    <select id="addStatus" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all bg-white">
                        <option value="active">Active</option>
                        <option value="discontinued">Discontinued</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Description</label>
                <input type="text" id="addDescription" placeholder="Short product description"
                    class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Selling Price ($) <span class="text-red-500">*</span></label>
                    <input type="number" id="addSellingPrice" required min="0" step="0.01" placeholder="0.00"
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Cost Price ($)</label>
                    <input type="number" id="addCostPrice" min="0" step="0.01" placeholder="0.00"
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Current Stock</label>
                    <input type="number" id="addStock" min="0" placeholder="0"
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Min Stock (ngưỡng cảnh báo)</label>
                    <input type="number" id="addMinStock" min="0" placeholder="0"
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
            </div>

            <!-- Error message -->
            <p id="addProductError" class="hidden text-sm text-red-600 bg-red-50 px-4 py-2 rounded-lg"></p>

            <!-- Buttons -->
            <div class="flex gap-3 pt-4 border-t border-gray-200">
                <button type="button" onclick="closeAddModal()"
                    class="flex-1 px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-all font-medium">
                    Cancel
                </button>
                <button type="submit" id="addSubmitBtn"
                    class="flex-1 px-6 py-3 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all shadow-md font-medium">
                    Add Product
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================
     FE-02: MODAL EDIT PRODUCT
     Điền sẵn dữ liệu — gọi PUT /api/products/update/:id
     ============================================================ -->
<div id="editModalOverlay" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-200">
            <div>
                <h3 class="text-xl font-semibold text-gray-900">Edit Product</h3>
                <p class="text-sm text-gray-500 mt-0.5">Update product information</p>
            </div>
            <button onclick="closeEditModal()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
            </button>
        </div>

        <!-- Form -->
        <form id="editProductForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">SKU <span class="text-red-500">*</span></label>
                    <input type="text" id="editSku" required
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Product Name <span class="text-red-500">*</span></label>
                    <input type="text" id="editName" required
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Category</label>
                    <select id="editCategory" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all bg-white">
                        <option value="Gạo">Gạo</option>
                        <option value="Mì gói">Mì gói</option>
                        <option value="Miến/Bún khô">Miến/Bún khô</option>
                        <option value="Bột">Bột</option>
                        <option value="Gia vị cơ bản">Gia vị cơ bản</option>
                        <option value="Ngũ cốc">Ngũ cốc</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Status</label>
                    <select id="editStatus" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all bg-white">
                        <option value="active">Active</option>
                        <option value="discontinued">Discontinued</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Description</label>
                <input type="text" id="editDescription"
                    class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Selling Price ($) <span class="text-red-500">*</span></label>
                    <input type="number" id="editSellingPrice" required min="0" step="0.01"
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Cost Price ($)</label>
                    <input type="number" id="editCostPrice" min="0" step="0.01"
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Current Stock</label>
                    <input type="number" id="editStock" min="0"
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Min Stock</label>
                    <input type="number" id="editMinStock" min="0"
                        class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-[#2563EB] transition-all"/>
                </div>
            </div>

            <!-- Error message -->
            <p id="editProductError" class="hidden text-sm text-red-600 bg-red-50 px-4 py-2 rounded-lg"></p>

            <!-- Buttons -->
            <div class="flex gap-3 pt-4 border-t border-gray-200">
                <button type="button" onclick="closeEditModal()"
                    class="flex-1 px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-all font-medium">
                    Cancel
                </button>
                <button type="submit" id="editSubmitBtn"
                    class="flex-1 px-6 py-3 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all shadow-md font-medium">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Product Modal -->
<div id="deleteModalOverlay" class="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4 hidden overlay-enter" onclick="closeDeleteModal()">
    <div id="deleteModal" class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl modal-enter" onclick="event.stopPropagation()">
        <div class="flex items-center gap-4 mb-4">
            <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center">
                <i data-lucide="trash-2" class="w-6 h-6 text-red-600"></i>
            </div>
            <h3 class="text-xl font-semibold text-gray-900">Delete Product</h3>
        </div>
        <p class="text-gray-600 mb-6">Are you sure you want to delete <strong id="deleteProductName"></strong>? This action cannot be undone.</p>
        <div class="flex items-center gap-3">
            <button onclick="closeDeleteModal()" class="flex-1 px-4 py-3 border-2 border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-all font-medium">Cancel</button>
            <button onclick="confirmDeleteProduct()" class="flex-1 px-4 py-3 bg-red-600 text-white rounded-xl hover:bg-red-700 transition-all shadow-sm font-medium">Delete</button>
        </div>
    </div>
</div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/pages/products.js"></script>
<script src="../assets/js/components/layout.js"></script>
</body>
</html>
