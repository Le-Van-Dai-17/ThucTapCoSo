<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ForecastAI - User Management</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .modal-enter { opacity: 0; transform: scale(0.95); transition: all 0.2s ease-out; }
        .modal-enter-active { opacity: 1; transform: scale(1); }
        .modal-leave { opacity: 1; transform: scale(1); transition: all 0.2s ease-in; }
        .modal-leave-active { opacity: 0; transform: scale(0.95); }
        .overlay-enter { opacity: 0; transition: opacity 0.2s ease-out; }
        .overlay-enter-active { opacity: 1; }
        .overlay-leave { opacity: 1; transition: opacity 0.2s ease-in; }
        .overlay-leave-active { opacity: 0; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="size-full flex h-screen overflow-hidden">

        <!-- Main Content -->
        <main class="ml-[240px] mt-16 flex-1 flex flex-col h-[calc(100vh-4rem)] overflow-y-auto bg-gray-50">
            <!-- Header Section -->
            <div class="bg-white border-b border-gray-200 px-8 py-6 shrink-0">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-2xl font-semibold text-gray-900">User Management</h1>
                        <p class="text-sm text-gray-500 mt-1">Manage system users, roles, and permissions</p>
                    </div>
                    <button onclick="openAddModal()" class="px-6 py-2.5 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all duration-200 flex items-center gap-2 shadow-sm hover:shadow-md font-medium">
                        <i data-lucide="user-plus" class="w-5 h-5"></i> Add User
                    </button>
                </div>
            </div>

            <!-- Page Body -->
            <div class="p-8 flex-1 flex flex-col min-h-0">
                <!-- Search and Filter Bar -->
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 p-4 mb-6 shrink-0">
                    <div class="flex items-center gap-4">
                        <div class="flex-1 relative">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                            <input type="text" id="searchInput" placeholder="Search by username, name, or email..." class="w-full pl-10 pr-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200" />
                        </div>
                        <select id="roleFilter" class="px-4 py-2.5 border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200 font-medium text-gray-700 bg-white min-w-[160px]">
                            <option value="All Roles">All Roles</option>
                            <option value="Admin">Admin</option>
                            <option value="Manager">Manager</option>
                            <option value="Staff">Staff</option>
                        </select>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="grid grid-cols-4 gap-6 mb-6 shrink-0" id="statsContainer">
                    <!-- JS fills this -->
                </div>

                <!-- Users Table -->
                <div class="bg-white rounded-[16px] shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col min-h-0 relative">
                    <div class="overflow-y-auto flex-1 h-full">
                        <table class="w-full whitespace-nowrap">
                            <thead class="bg-gray-50 sticky top-0 z-10">
                                <tr>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Username</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Full Name</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Email</th>
                                    <th class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Role</th>
                                    <th class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Status</th>
                                    <th class="px-6 py-4 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Created Date</th>
                                    <th class="px-6 py-4 text-center text-xs font-semibold text-gray-700 uppercase tracking-wider border-b border-gray-200">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-gray-100">
                                <!-- JS fills this -->
                            </tbody>
                        </table>

                        <!-- Empty State -->
                        <div id="emptyState" class="hidden py-16 text-center w-full">
                            <div class="text-gray-400 mb-2 flex justify-center">
                                <i data-lucide="search" class="w-12 h-12"></i>
                            </div>
                            <p class="text-gray-600 font-medium">No users found</p>
                            <p class="text-sm text-gray-500 mt-1">Try adjusting your search or filter</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->

    <!-- Add User Modal -->
    <div id="addModalOverlay" class="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4 hidden overlay-enter" onclick="closeAddModal()">
        <div id="addModal" class="bg-white rounded-2xl p-8 max-w-2xl w-full shadow-2xl modal-enter" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-6 pb-6 border-b border-gray-200">
                <div>
                    <h3 id="modalTitle" class="text-2xl font-semibold text-gray-900">Add New User</h3>
                    <p class="text-sm text-gray-500 mt-1">Create a new user account</p>
                </div>
                <button onclick="closeAddModal()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors">
                    <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
                </button>
            </div>
            
            <form id="addForm" onsubmit="handleAddSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Username <span class="text-red-500">*</span></label>
                        <input type="text" id="addUsername" required class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200 disabled:bg-gray-100 disabled:text-gray-500" placeholder="e.g. john.doe" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">Full Name <span class="text-red-500">*</span></label>
                        <input type="text" id="addFullName" required class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200" placeholder="e.g. John Doe" />
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Email <span class="text-red-500">*</span></label>
                    <input type="email" id="addEmail" required class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200" placeholder="e.g. john.doe@company.com" />
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Password <span class="text-red-500">*</span></label>
                    <input type="password" id="addPassword" class="w-full px-4 py-2.5 border-2 border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#2563EB]/20 focus:border-[#2563EB] transition-all duration-200" placeholder="Min. 6 characters (Leave empty to keep current password)" minlength="6"/>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex items-center justify-center gap-2 cursor-pointer px-4 py-3 border-2 rounded-xl transition-all duration-200 border-gray-200 hover:bg-gray-50" id="lblRoleManager">
                            <input type="radio" name="addRole" value="Manager" onchange="updateRadioStyles()" class="w-4 h-4 text-[#2563EB]" />
                            <span class="text-sm font-medium text-gray-700">Manager</span>
                        </label>
                        <label class="flex items-center justify-center gap-2 cursor-pointer px-4 py-3 border-2 rounded-xl transition-all duration-200 border-gray-200 hover:bg-gray-50" id="lblRoleStaff">
                            <input type="radio" name="addRole" value="Staff" checked onchange="updateRadioStyles()" class="w-4 h-4 text-[#2563EB]" />
                            <span class="text-sm font-medium text-gray-700">Staff</span>
                        </label>
                    </div>
                </div>

                <div class="flex items-center gap-3 mt-6 pt-6 border-t border-gray-200">
                    <button type="button" onclick="closeAddModal()" class="flex-1 px-6 py-3 border-2 border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-gray-400 transition-all duration-200 font-medium">Cancel</button>
                    <button type="submit" id="modalSubmitBtn" class="flex-1 px-6 py-3 bg-[#2563EB] text-white rounded-xl hover:bg-[#1d4ed8] transition-all duration-200 shadow-md hover:shadow-xl font-medium">Add User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModalOverlay" class="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4 hidden overlay-enter" onclick="closeDeleteModal()">
        <div id="deleteModal" class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl modal-enter" onclick="event.stopPropagation()">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center">
                    <i data-lucide="alert-circle" class="w-6 h-6 text-red-600"></i>
                </div>
                <h3 class="text-xl font-semibold text-gray-900">Delete User</h3>
            </div>
            <p class="text-gray-600 mb-6">
                Are you sure you want to delete user <strong id="deleteUserName"></strong> (@<span id="deleteUsernameTag"></span>)? This action cannot be undone.
            </p>
            <div class="flex items-center gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 px-4 py-3 border-2 border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-all duration-200 font-medium">Cancel</button>
                <button onclick="confirmDeleteUser()" class="flex-1 px-4 py-3 bg-red-600 text-white rounded-xl hover:bg-red-700 transition-all duration-200 shadow-sm hover:shadow-md font-medium">Delete User</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/pages/users.js"></script>
    <script src="../assets/js/components/layout.js"></script>
</body>
</html>
